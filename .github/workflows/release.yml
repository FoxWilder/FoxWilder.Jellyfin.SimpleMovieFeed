name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
              throw "Invalid release tag: $tag"
          }
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release assembly version requires a stable vMAJOR.MINOR.PATCH tag: $tag"
          }
          $assemblyVersion = "$version.0"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "assembly_version=$assemblyVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/Jellyfin.Plugin.SimpleMovieFeed/Jellyfin.Plugin.SimpleMovieFeed.csproj --configuration Release --property:Version=${{ steps.release.outputs.version }} --property:AssemblyVersion=${{ steps.release.outputs.assembly_version }} --property:FileVersion=${{ steps.release.outputs.assembly_version }} --property:InformationalVersion=${{ steps.release.outputs.version }}

      - name: Validate release version metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSEMBLY_VERSION: ${{ steps.release.outputs.assembly_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'src/Jellyfin.Plugin.SimpleMovieFeed/bin/Release/net9.0/Jellyfin.Plugin.SimpleMovieFeed.dll'
          if (-not (Test-Path $dll -PathType Leaf)) {
              throw 'Release DLL was not created.'
          }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll))
          $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $dll)).Version.ToString()
          if ($assemblyVersion -ne $env:RELEASE_ASSEMBLY_VERSION) {
              throw "AssemblyVersion mismatch: expected $env:RELEASE_ASSEMBLY_VERSION, got $assemblyVersion"
          }
          if ($info.FileVersion -ne $env:RELEASE_ASSEMBLY_VERSION) {
              throw "FileVersion mismatch: expected $env:RELEASE_ASSEMBLY_VERSION, got $($info.FileVersion)"
          }
          if ($info.ProductVersion -notlike "$env:RELEASE_VERSION*") {
              throw "ProductVersion mismatch: expected $env:RELEASE_VERSION, got $($info.ProductVersion)"
          }
          Write-Host "AssemblyVersion: $assemblyVersion"
          Write-Host "FileVersion: $($info.FileVersion)"
          Write-Host "ProductVersion: $($info.ProductVersion)"

      - name: Package and validate release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src/Jellyfin.Plugin.SimpleMovieFeed/bin/Release/net9.0'
          $artifacts = 'artifacts'
          $stage = Join-Path $artifacts 'SimpleMovieFeed'
          $zip = Join-Path $artifacts "SimpleMovieFeed-$env:RELEASE_TAG.zip"
          $checksum = "$zip.sha256"

          Remove-Item $artifacts -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $required = @(
              'Jellyfin.Plugin.SimpleMovieFeed.dll'
          )

          $optional = @(
              'System.Security.Cryptography.ProtectedData.dll'
          )

          foreach ($file in $required) {
              $path = Join-Path $source $file
              if (-not (Test-Path $path -PathType Leaf)) {
                  throw "Required release file missing: $file"
              }
              Copy-Item $path $stage
          }

          foreach ($file in $optional) {
              $path = Join-Path $source $file
              if (Test-Path $path -PathType Leaf) {
                  Copy-Item $path $stage
                  Write-Host "Including optional runtime dependency: $file"
              }
          }

          Copy-Item 'LICENSE' $stage
          Copy-Item 'README.md' $stage

          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          if (-not (Test-Path $zip -PathType Leaf)) {
              throw 'Release ZIP was not created.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
              $entries = @($archive.Entries | ForEach-Object { $_.FullName })
          }
          finally {
              $archive.Dispose()
          }

          foreach ($file in $required) {
              if ($entries -notcontains $file) {
                  throw "Release ZIP validation failed: $file is missing."
              }
          }

          if ($entries -match '\.(pdb|deps\.json)$') {
              throw 'Release ZIP contains unwanted development/runtime metadata.'
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipName = Split-Path $zip -Leaf
          Set-Content -Path $checksum -Value "$hash  $zipName" -Encoding ASCII

          Write-Host 'Release package contents:'
          $entries | Sort-Object | ForEach-Object { Write-Host "  $_" }
          Write-Host "SHA256: $hash"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/SimpleMovieFeed-$env:RELEASE_TAG.zip" `
            "artifacts/SimpleMovieFeed-$env:RELEASE_TAG.zip.sha256" `
            --repo "${{ github.repository }}" `
            --title "SimpleMovieFeed $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag `
            --latest
