name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.SimpleMovieFeed/Jellyfin.Plugin.SimpleMovieFeed.csproj --configuration Release

      - name: Stage release
        shell: pwsh
        run: |
          $source = 'src/Jellyfin.Plugin.SimpleMovieFeed/bin/Release/net9.0'
          $stage = 'artifacts/SimpleMovieFeed'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$source/Jellyfin.Plugin.SimpleMovieFeed.dll" $stage
          if (Test-Path "$source/System.Security.Cryptography.ProtectedData.dll") {
              Copy-Item "$source/System.Security.Cryptography.ProtectedData.dll" $stage
          }
          Copy-Item LICENSE $stage
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/SimpleMovieFeed-$env:GITHUB_REF_NAME.zip" -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/SimpleMovieFeed-*.zip
